name: Issue Auto-Labeler

on:
  issues:
    types: [opened]

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add labels based on issue content
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const textToCheck = `${title} ${body}`;

            const labelsToAdd = new Set();

            // Always add ECSoC26
            labelsToAdd.add('ECSoC26');

            // Define keyword mappings based on the repository's labels
            const keywordMap = {
              'frontend': 'frontend',
              'react': 'frontend',
              'tailwind': 'frontend',
              'css': 'frontend',
              'ui': 'frontend',
              'backend': 'backend',
              'api': 'backend',
              'supabase': 'backend',
              'database': 'database',
              'postgres': 'database',
              'sql': 'database',
              'docs': 'docs',
              'documentation': 'docs',
              'readme': 'docs',
              'design': 'design',
              'ux': 'design',
              'figma': 'design',
              'bug': 'bug',
              'error': 'bug',
              'fix': 'bug',
              'enhancement': 'enhancement',
              'feature': 'enhancement'
            };

            // Check for keywords as isolated words or simple matches
            for (const [keyword, label] of Object.entries(keywordMap)) {
              // Create a regex to match the keyword as a whole word to avoid partial matches
              const regex = new RegExp(`\\b${keyword}\\b`, 'i');
              if (regex.test(textToCheck)) {
                labelsToAdd.add(label);
              }
            }

            // Convert to array and strictly filter out any 'good-*' labels
            const finalLabels = Array.from(labelsToAdd).filter(label => !label.toLowerCase().startsWith('good-'));

            console.log("Adding labels:", finalLabels);

            if (finalLabels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: finalLabels
              });
            }
