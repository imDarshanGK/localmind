name: PR Sync

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  sync-issue-to-pr:
    name: PR Sync
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Sync Assignees and Labels from Linked Issue
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';
            const prTitle = context.payload.pull_request.title || '';
            const regex = /(?:fix(?:e[sd])?|resolve[sd]?|close[sd]?)\s+(?:#(\d+)|https:\/\/github\.com\/[^\/]+\/[^\/]+\/issues\/(\d+))/i;

            const matchBody = prBody.match(regex);
            const matchTitle = prTitle.match(regex);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;

            // Helper to get previous warning comments from the bot
            async function getBotWarningComments() {
              try {
                const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
                return comments.filter(c => c.user.login === 'github-actions[bot]' && c.body.includes('Missing Closing Keyword'));
              } catch (e) {
                console.error('Error fetching comments:', e);
                return [];
              }
            }

            if (!matchBody) {
              console.log('No linked issue found in the PR body.');
              
              const existingWarnings = await getBotWarningComments();
              const hasWarning = existingWarnings.length > 0;
              
              let warningMessage = '⚠️ **Missing Closing Keyword**\n\nIt looks like you haven\'t linked an issue to this pull request. Please include a closing keyword (e.g., `Resolves #123` or `Fixes #123`) in the **PR description** to link it to an issue. This will automatically sync labels and assignees.';
              
              if (matchTitle) {
                warningMessage = '⚠️ **Missing Closing Keyword in Description**\n\nWe noticed a closing keyword in the PR **title**, but GitHub requires it to be in the **PR description** (body) to automatically link and close the issue. Please edit the description to include it (e.g., `Resolves #123`).';
              }
              
              if (!hasWarning) {
                try {
                  await github.rest.issues.createComment({ owner, repo, issue_number, body: warningMessage });
                  console.log('Added missing keyword comment.');
                } catch (e) {
                  console.error('Failed to add comment:', e);
                }
              }
              
              // Fail the action to block merging
              core.setFailed('Missing closing keyword in the PR description. Please add it to link an issue.');
              return;
            }

            // If we reach here, there IS a valid match in the body.
            console.log('Valid closing keyword found in PR body.');

            // Clean up any old warning comments since the author fixed it
            const oldWarnings = await getBotWarningComments();
            for (const warning of oldWarnings) {
              try {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: warning.id });
                console.log(`Deleted resolved warning comment ${warning.id}`);
              } catch (e) {
                console.error('Failed to delete comment:', e);
              }
            }

            const issueNumber = parseInt(matchBody[1] || matchBody[2], 10);
            console.log(`Found linked issue: #${issueNumber}`);

            try {
              // Fetch the linked issue
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              
              // Get Assignees
              const assignees = issue.assignees.map(a => a.login);
              if (assignees.length > 0) {
                console.log(`Assigning PR to: ${assignees.join(', ')}`);
                try {
                  await github.rest.issues.addAssignees({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.payload.pull_request.number,
                    assignees: assignees
                  });
                } catch (assignError) {
                  console.error('Failed to add assignees:', assignError.message);
                }
              } else {
                console.log('Linked issue has no assignees.');
              }
              
              // Get Labels
              let labels = issue.labels.map(l => l.name);
              
              // Wait for auto-labeler to add labels (race condition check)
              let retries = 0;
              while (labels.length === 0 && retries < 5) {
                console.log('No labels found on issue, waiting 5s for auto-labeler...');
                await new Promise(r => setTimeout(r, 5000));
                
                const { data: updatedIssue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                labels = updatedIssue.labels.map(l => l.name);
                retries++;
              }
              
              // Filter out issue-specific labels like 'good-ui' and 'ECSoC26-L1'
              labels = labels.filter(label => 
                !label.toLowerCase().startsWith('good-') && 
                !label.match(/-L\d+$/i) &&
                label.toLowerCase() !== 'blue'
              );

              
              if (labels.length > 0) {
                console.log(`Adding labels to PR: ${labels.join(', ')}`);
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.payload.pull_request.number,
                    labels: labels
                  });
                } catch (labelError) {
                  console.error('Failed to add labels:', labelError.message);
                }
              } else {
                console.log('Linked issue has no labels.');
              }
              
              // Validate Assignee and ECSoC26 label presence
              const hasAssignee = assignees.length > 0;
              // Strip punctuation/spaces and check for ecsoc26 to handle variations like "ECSoC'26"
              const hasECSoCLabel = labels.some(l => l.toLowerCase().replace(/[^a-z0-9]/g, '').includes('ecsoc26'));
              
              if (!hasAssignee || !hasECSoCLabel) {
                let errorMsg = 'Validation failed:';
                if (!hasAssignee) errorMsg += ' The linked issue has no assignees.';
                if (!hasECSoCLabel) errorMsg += ' The linked issue is missing the ECSoC26 label.';
                errorMsg += ' Please update the linked issue, then edit this PR description (even just adding a space) to re-trigger this check.';
                
                core.setFailed(errorMsg);
                return;
              }
              
              console.log('Validation passed: PR has an assignee and the ECSoC26 label.');
              
            } catch (error) {
              console.error(`Failed to fetch issue #${issueNumber}:`, error.message);
              core.setFailed(`Error during sync: ${error.message}`);
            }
